server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for app assets, JSON, Ink scripts, and Markdown docs
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/markdown
        application/javascript
        application/json
        image/svg+xml;

    # Serve scenario packs with no-cache so live edits on Synology NAS reflect immediately
    location /scenarios/ {
        types {
            application/json json;
            text/plain ink;
            text/markdown md;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Long-term caching for hashed Vite assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
